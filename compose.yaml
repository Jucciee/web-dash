services:
  dashboard:
    container_name: web-dash
    image: web-dash:0.3.0
    build:
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-8080}:8080"
    environment:
      DASHBOARD_COOKIE_SECURE: "${DASHBOARD_COOKIE_SECURE:-false}"
      DASHBOARD_LOG_LEVEL: "${DASHBOARD_LOG_LEVEL:-info}"
      DASHBOARD_LOG_FORMAT: "${DASHBOARD_LOG_FORMAT:-json}"
      DASHBOARD_DOCKER_HOST: "${DASHBOARD_DOCKER_HOST:-}"
    volumes:
      - dashboard-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777

volumes:
  dashboard-data:
